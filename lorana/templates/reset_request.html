{% extends 'layout.html'%}
{% block content %}
<div class="container mt-5">
    <form method="post">
        {{form.hidden_tag()}}
        <div class="mt-3">
            {{form.email.label}}
            {{form.email(class="form-control")}}
            {% if form.email.errors %}
                {% for error in form.email.errors %}
                    <span class="text-danger">{{ error }}</span>
                {% endfor %}
            {% endif %}
        </div>
        <div class="form-group my-3">
                {{ form.submit(class='btn btn-outline-info')}}
        </div>

    </form>

</div>
{% endblock content %}
