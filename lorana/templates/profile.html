{% extends 'layout.html'%}
{% block content%}
<div class="container mt-5">
    <div class="card shadow border-0 rounded-4 p-4" style="max-width: 600px; margin: auto;">
        <h3 class="text-center mb-4 fw-bold">My Profile</h3>
        <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>First Name:</strong> {{ user.fName }}</li>
            <li class="list-group-item"><strong>Last Name:</strong> {{ user.lName }}</li>
            <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
            <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
        </ul>
        <div class="text-center mt-4">
            <a href="{{ url_for('users.edit_profile') }}" class="btn btn-outline-primary rounded-pill px-4">Edit Profile</a>
        </div>
    </div>
</div>
{% endblock content%}
